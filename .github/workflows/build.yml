# Every push and pull request: crypto + handshake verification, unit tests, localization check,
# Homebrew cask lint, Android lint, macOS .app and Android APK builds.
#
# Actions are pinned by commit SHA (Dependabot bumps them with the tag in the comment). The APK
# signing key is only ever decoded on a push to main, the one build that is published.
#
# Pushes to main additionally publish ONE rolling release for the version in the VERSION file:
#   • the tag "v<VERSION>" is re-pointed at HEAD (release and tag deleted, then recreated), titled
#     "AndroMac <VERSION>", with assets AndroMac-<VERSION>-macOS-arm64.dmg,
#     AndroMac-<VERSION>-android.apk and SHA256SUMS.txt; the commit is the tag's target;
#   • the notes are the "## <VERSION>" sections of CHANGELOG.md and CHANGELOG.tr.md plus the
#     commits since the previous build of that version;
#   • the apps report version <VERSION>, build = run number (the Android versionCode), commit sha.
# Raising VERSION leaves the old release where it is and starts a new rolling one.
#
# See docs/RELEASING.md for the whole picture.
name: build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (tags, releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  ANDROID_PACKAGES: "platforms;android-37.0 build-tools;36.0.0"

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      commit: ${{ steps.v.outputs.commit }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # "previous" is the commit the tag v<VERSION> pointed at before this run (empty on the
      # first build of a version); the release notes list the commits since then.
      - id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$version'"; exit 1; }
          previous="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)"
          {
            echo "version=$version"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "commit=${GITHUB_SHA::7}"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (build $GITHUB_RUN_NUMBER, commit ${GITHUB_SHA::7}, previous build of v$version: ${previous:-none})"

  macos:
    name: macOS · verify + .app
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          swift --version

      # The verification scripts run the Kotlin side through Gradle; AGP needs an
      # Android SDK at configuration time even though the vectors module is plain JVM.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      # The published build starts from an empty cache, so nothing a branch wrote can reach it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Crypto vectors (CryptoKit vs JCE)
        run: scripts/verify-crypto.sh

      - name: Handshake (real Session code over loopback)
        run: scripts/verify-handshake.sh

      - name: Unit tests (Swift Testing)
        working-directory: macos
        run: swift test

      # The cask must stay installable; brew style catches a broken stanza before a user does.
      - name: Homebrew cask
        run: brew style Casks/*.rb

      # Every .lproj must be complete; a missing key means a translation PR is unfinished.
      - name: Localization files complete
        run: macos/scripts/update-strings.sh --check

      # scrcpy and adb for screen mirroring, pinned by version and SHA-256 in the script.
      - name: scrcpy
        run: macos/scripts/fetch-scrcpy.sh

      - name: AndroMac.app
        working-directory: macos
        env:
          ANDROMAC_VERSION: ${{ needs.version.outputs.version }}
          ANDROMAC_BUILD: ${{ needs.version.outputs.build }}
          ANDROMAC_COMMIT: ${{ needs.version.outputs.commit }}
        run: ./build.sh

      # One DMG, Apple Silicon only (the runner builds arm64; there is no Intel build). People
      # open it and drag to Applications; the in-app updater and the Homebrew cask mount it. The
      # commit is not in the file name, so a rebuild of the same version keeps the same name.
      - name: Package
        working-directory: macos/build
        env:
          NAME: AndroMac-${{ needs.version.outputs.version }}-macOS-arm64
        run: |
          codesign --verify --strict --verbose=2 AndroMac.app
          test -x AndroMac.app/Contents/MacOS/scrcpy
          mkdir dmg-root
          cp -R AndroMac.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname AndroMac -srcfolder dmg-root -ov -format UDZO "$NAME.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: macos/build/AndroMac-*-macOS-arm64.dmg
          if-no-files-found: error

  android:
    name: Android · APK
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      # The published build starts from an empty cache, so nothing a branch wrote can reach it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Signed with the release keystore from the repository secrets on a push to main, the build
      # that gets published. Every other build (branches, pull requests) uses the runner's debug
      # key, so a branch that edits the Gradle files never runs next to the real key. Without the
      # secrets main falls back to the debug key too (installable, but not upgradable across
      # builds; run scripts/setup-android-signing.sh once to fix that).
      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key"
          fi

      # The app's Android-free logic on a plain JVM: version ordering, the release lookup.
      - name: Unit tests (JVM) and lint
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :vectors:test :app:lintDebug

      - name: APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PandromacVersion="${{ needs.version.outputs.version }}" \
            -PandromacBuild="${{ needs.version.outputs.build }}" \
            -PandromacCommit="${{ needs.version.outputs.commit }}"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/AndroMac-${{ needs.version.outputs.version }}-android.apk"

      # The decoded keystore must not outlive the build, not even on a failed run.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: android/app/build/outputs/apk/release/AndroMac-*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, macos, android]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      COMMIT: ${{ needs.version.outputs.commit }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # The "## <version>" section of CHANGELOG.md, the Turkish one folded below it, then the
      # commits since the previous build of this version.
      - name: Release notes
        run: |
          section() { awk -v v="$2" '/^## /{p = ($2 == v)} p && !/^## /' "$1" | sed -e '1{/^$/d;}'; }
          # Release notes render every newline as a line break, so the 100-column wrapping of
          # the changelog is joined back into one line per paragraph and list item.
          unwrap() { awk '
            { q = ""; b = $0; if (b ~ /^>/) { q = ">"; sub(/^> ?/, "", b) } }
            b ~ /^```/ { fence = !fence }
            n && !fence && q == pq && b != "" && pb != "" && pb !~ /^(#|\[!)/ \
              && b !~ /^ *([-*]|[0-9]+\.) / && b !~ /^(#|\||```|<)/ {
              sub(/^ +/, "", b); line[n] = line[n] " " b; next }
            { line[++n] = $0; pq = q; pb = b }
            END { for (i = 1; i <= n; i++) print line[i] }'; }
          en="$(section CHANGELOG.md "$VERSION" | unwrap)"
          tr="$(section CHANGELOG.tr.md "$VERSION" | unwrap)"
          [ -n "$en" ] || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          [ -n "$tr" ] || { echo "::error::CHANGELOG.tr.md has no '## $VERSION' section"; exit 1; }
          {
            echo "## What's new"
            echo
            echo "$en"
            echo
            echo "<details>"
            echo "<summary><b>Türkçe</b></summary>"
            echo
            echo "## Yenilikler"
            echo
            echo "$tr"
            echo
            echo "</details>"
            echo
            echo "## Changes in this build"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s (%h)' "${PREVIOUS}..HEAD" | head -50
            else
              echo "First build of ${VERSION}."
            fi
            echo
            echo "**Install:** see the [README](https://github.com/${GITHUB_REPOSITORY}#install) · "
            echo "**Kurulum:** [README.tr](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.tr.md#kurulum)"
            echo
            echo "<sub>Build ${BUILD} · commit ${COMMIT} · APK signing: ${SIGNING} · checksums in SHA256SUMS.txt</sub>"
          } > notes.md

      # One rolling release per version: the tag moves to HEAD on every push to main.
      - name: Publish release
        run: |
          gh release delete "v${VERSION}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "AndroMac ${VERSION}" \
            --notes-file notes.md \
            dist/*
