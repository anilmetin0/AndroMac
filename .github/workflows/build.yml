# Every push and pull request: crypto + handshake verification, unit tests, localization check,
# Homebrew cask lint, Android lint, macOS .app and Android APK builds.
#
# Actions are pinned by commit SHA (Dependabot bumps them with the tag in the comment). The
# signing keys (APK keystore, Mac certificate) are only ever decoded on main, for the build that
# is published.
#
# Pushes to main also publish, on one of two channels:
#   • stable: the first push after VERSION changes (the tag v<VERSION> does not exist yet), a
#     push whose message has [stable], or a manual run with channel=stable. Tag v<VERSION>, title
#     "AndroMac <VERSION>", assets AndroMac-<VERSION>-macOS-arm64.dmg,
#     AndroMac-<VERSION>-android.apk, SHA256SUMS.txt. It goes out as a prerelease, so beta
#     testers get it first; `gh release edit v<VERSION> --prerelease=false --latest` makes it the
#     one /releases/latest and the stable updaters see. The notes are the "## <VERSION>" section
#     of CHANGELOG.md plus the commits since the previous version, grouped by type.
#   • beta: every other push. A prerelease tagged beta-<BUILD>-<sha>, titled
#     "AndroMac <VERSION> beta <BUILD> (<sha>)", assets AndroMac-beta-<BUILD>-…; the notes list
#     the commits since v<VERSION>. Only the newest five betas are kept.
# The apps report version <VERSION>, build = run number (the Android versionCode), commit sha.
#
# See docs/RELEASING.md for the whole picture.
name: build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel for a run on main"
        type: choice
        options: [beta, stable]
        default: beta

# Read-only by default; only the release job may write (tags, releases).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  ANDROID_PACKAGES: "platforms;android-37.0 build-tools;36.0.0"

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      commit: ${{ steps.v.outputs.commit }}
      previous: ${{ steps.v.outputs.previous }}
      channel: ${{ steps.v.outputs.channel }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # channel: stable on the first push of a new VERSION (or when asked for), beta otherwise,
      # none off main. previous: where the notes' commit list starts. For stable, the previous
      # version's tag; for beta, v<VERSION>.
      - id: v
        env:
          REQUESTED: ${{ inputs.channel }}
          # "[stable]" in the pushed commit's message re-publishes the stable release from it.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ON_MAIN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$version'"; exit 1; }
          build="$GITHUB_RUN_NUMBER"; commit="${GITHUB_SHA::7}"
          current="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)"
          if [[ "$ON_MAIN" != "true" ]]; then
            channel=none
          elif [[ -z "$current" || "$REQUESTED" == "stable" || "$HEAD_MESSAGE" == *"[stable]"* ]]; then
            channel=stable
          else
            channel=beta
          fi
          if [[ "$channel" == "beta" ]]; then
            name="AndroMac-beta-$build"; previous="$current"
          else
            name="AndroMac-$version"
            # The previous version's tag, also on a re-publish: the notes list the whole version,
            # and this version's old target may no longer be an ancestor after a rewrite.
            previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "v$version" | head -1 || true)"
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "commit=$commit"
            echo "previous=$previous"
            echo "channel=$channel"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, build $build, commit $commit, channel $channel, notes from ${previous:-the start}"

  macos:
    name: macOS · verify + .app
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          swift --version

      # The verification scripts run the Kotlin side through Gradle; AGP needs an
      # Android SDK at configuration time even though the vectors module is plain JVM.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      # The published build starts from an empty cache, so nothing a branch wrote can reach it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Crypto vectors (CryptoKit vs JCE)
        run: scripts/verify-crypto.sh

      - name: Handshake (real Session code over loopback)
        run: scripts/verify-handshake.sh

      - name: Unit tests (Swift Testing)
        working-directory: macos
        run: swift test

      # The cask must stay installable; brew style catches a broken stanza before a user does, and
      # its version has to follow VERSION or the download URL points at the previous release.
      - name: Homebrew cask
        run: |
          brew style Casks/*.rb
          grep -q "^  version \"$(cat VERSION)\"$" Casks/andromac.rb \
            || { echo "::error::Casks/andromac.rb version does not match VERSION"; exit 1; }

      # Every .lproj must be complete; a missing key means a translation PR is unfinished.
      - name: Localization files complete
        run: macos/scripts/update-strings.sh --check

      # scrcpy and adb for screen mirroring, pinned by version and SHA-256 in the script.
      - name: scrcpy
        run: macos/scripts/fetch-scrcpy.sh

      # One self-signed certificate for every published build, so the Keychain sees the same app
      # across updates (scripts/setup-macos-signing.sh). Without it the build is signed ad-hoc.
      - name: Signing certificate
        env:
          P12_B64: ${{ needs.version.outputs.channel != 'none' && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
          P12_PASS: ${{ needs.version.outputs.channel != 'none' && secrets.MACOS_SIGNING_PASSWORD || '' }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "::warning::MACOS_SIGNING_P12_BASE64 is not set; the app is signed ad-hoc"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          # codesign looks identities up through the search list, and an untrusted self-signed
          # certificate is not found by name; the keychain goes on the list and the certificate
          # is named by its SHA-1.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          sha1="$(security find-certificate -c "AndroMac Self-Signed" -Z "$kc" | awk '/SHA-1/ {print $NF}')"
          [ -n "$sha1" ] || { echo "::error::the imported certificate was not found"; exit 1; }
          echo "CODESIGN_IDENTITY=$sha1" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: AndroMac.app
        working-directory: macos
        env:
          ANDROMAC_VERSION: ${{ needs.version.outputs.version }}
          ANDROMAC_BUILD: ${{ needs.version.outputs.build }}
          ANDROMAC_COMMIT: ${{ needs.version.outputs.commit }}
        run: ./build.sh

      # The certificate must not outlive the build, not even on a failed run.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # One DMG, Apple Silicon only (the runner builds arm64; there is no Intel build). People
      # open it and drag to Applications; the in-app updater and the Homebrew cask mount it. The
      # commit is not in the file name, so a rebuild of the same version keeps the same name.
      - name: Package
        working-directory: macos/build
        env:
          NAME: ${{ needs.version.outputs.name }}-macOS-arm64
        run: |
          codesign --verify --strict --verbose=2 AndroMac.app
          test -x AndroMac.app/Contents/MacOS/scrcpy
          mkdir dmg-root
          cp -R AndroMac.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname AndroMac -srcfolder dmg-root -ov -format UDZO "$NAME.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: macos/build/AndroMac-*-macOS-arm64.dmg
          if-no-files-found: error

  android:
    name: Android · APK
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      # The published build starts from an empty cache, so nothing a branch wrote can reach it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Signed with the release keystore from the repository secrets on a push to main, the build
      # that gets published. Every other build (branches, pull requests) uses the runner's debug
      # key, so a branch that edits the Gradle files never runs next to the real key. Without the
      # secrets main falls back to the debug key too (installable, but not upgradable across
      # builds; run scripts/setup-android-signing.sh once to fix that).
      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ needs.version.outputs.channel != 'none' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key"
          fi

      # The app's Android-free logic on a plain JVM: version ordering, the release lookup.
      - name: Unit tests (JVM) and lint
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :vectors:test :app:lintDebug

      - name: APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.sign.outputs.signing == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PandromacVersion="${{ needs.version.outputs.version }}" \
            -PandromacBuild="${{ needs.version.outputs.build }}" \
            -PandromacCommit="${{ needs.version.outputs.commit }}"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/${{ needs.version.outputs.name }}-android.apk"

      # The decoded keystore must not outlive the build, not even on a failed run.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: android/app/build/outputs/apk/release/AndroMac-*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: needs.version.outputs.channel != 'none'
    needs: [version, macos, android]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      COMMIT: ${{ needs.version.outputs.commit }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Stable: the "## <version>" section of CHANGELOG.md, then the commits since the previous
      # version. Beta: the commits since v<VERSION>. English only; the Turkish changelog lives in
      # the repository.
      - name: Release notes
        run: |
          section() { awk -v v="$2" '/^## /{p = ($2 == v)} p && !/^## /' "$1" | sed -e '1{/^$/d;}'; }
          # Release notes render every newline as a line break, so the 100-column wrapping of
          # the changelog is joined back into one line per paragraph and list item.
          unwrap() { awk '
            { q = ""; b = $0; if (b ~ /^>/) { q = ">"; sub(/^> ?/, "", b) } }
            b ~ /^```/ { fence = !fence }
            n && !fence && q == pq && b != "" && pb != "" && pb !~ /^(#|\[!)/ \
              && b !~ /^ *([-*]|[0-9]+\.) / && b !~ /^(#|\||```|<)/ {
              sub(/^ +/, "", b); line[n] = line[n] " " b; next }
            { line[++n] = $0; pq = q; pb = b }
            END { for (i = 1; i <= n; i++) print line[i] }'; }
          # Conventional Commit subjects, grouped: features, fixes, then the rest. The scope
          # becomes the platform, the type and the [stable] marker go.
          commits() {
            if [ -z "$PREVIOUS" ]; then echo "First build."; return; fi
            git log --no-merges --format='%h%x09%s' "${PREVIOUS}..HEAD" | head -80 | awk -F'\t' '
              { s = $2; sub(/ *\[stable\]/, "", s); t = "other"; scope = ""
                if (match(s, /^[a-z]+(\([^)]*\))?!?: /)) {
                  head = substr(s, 1, RLENGTH - 2); s = substr(s, RLENGTH + 1)
                  t = head; sub(/[(!].*/, "", t)
                  if (match(head, /\([^)]*\)/)) scope = substr(head, RSTART + 1, RLENGTH - 2)
                }
                if (scope == "macos") scope = "Mac"; else if (scope == "android") scope = "Android"
                else if (scope != "") scope = toupper(substr(scope, 1, 1)) substr(scope, 2)
                line = "- " (scope != "" ? "**" scope ":** " : "") toupper(substr(s, 1, 1)) substr(s, 2) " (" $1 ")"
                g = (t == "feat") ? 1 : (t == "fix") ? 2 : 3
                out[g] = out[g] line "\n" }
              END { split("New|Fixed|Other", name, "|")
                for (g = 1; g <= 3; g++) if (out[g] != "") printf "### %s\n\n%s\n", name[g], out[g] }'
          }
          if [ "$CHANNEL" = "stable" ]; then
            en="$(section CHANGELOG.md "$VERSION" | unwrap)"
            [ -n "$en" ] || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          fi
          {
            if [ "$CHANNEL" = "stable" ]; then
              echo "## What's new"; echo; echo "$en"; echo
              echo "## Changes in this release"; echo; commits; echo
            else
              echo "> [!WARNING]"
              echo "> A test build of what comes after ${VERSION}. The stable release is the one marked Latest."
              echo
              echo "## Changes since ${VERSION}"; echo; commits; echo
            fi
            echo "**Install:** see the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo
            echo "<sub>Build ${BUILD} · commit ${COMMIT} · APK signing: ${SIGNING} · checksums in SHA256SUMS.txt</sub>"
          } > notes.md

      # Stable: one release per version, re-created on a re-publish. Always a prerelease first;
      # promoting it to latest is a deliberate step (docs/RELEASING.md).
      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        run: |
          gh release delete "v${VERSION}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "AndroMac ${VERSION}" \
            --notes-file notes.md \
            dist/*

      # Beta: a prerelease per push, never latest; the newest five stay, older ones go with their tags.
      - name: Publish beta
        if: env.CHANNEL == 'beta'
        run: |
          gh release create "beta-${BUILD}-${COMMIT}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "AndroMac ${VERSION} beta ${BUILD} (${COMMIT})" \
            --notes-file notes.md \
            dist/*
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("beta-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
