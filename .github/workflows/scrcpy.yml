# Weekly: moves the bundled scrcpy (and the adb it ships) to its latest release. The hash comes
# from that release's SHA256SUMS.txt, the same source a manual bump uses; fetch-scrcpy.sh checks
# it again when the app is built. main only takes commits whose builds passed, so the bump goes
# through a pull request. A branch or pull request made with GITHUB_TOKEN starts no workflow, so
# this job dispatches the build on the branch itself (a run off main publishes nothing), waits for
# it, merges, and dispatches the build on main that publishes the nightly with the new scrcpy. A
# stable release still needs VERSION raised.
name: scrcpy

on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump
        id: bump
        run: |
          gh api repos/Genymobile/scrcpy/releases/latest > "$RUNNER_TEMP/release.json"
          tag="$(jq -r .tag_name "$RUNNER_TEMP/release.json")"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::unexpected tag '$tag'"; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS.txt" \
            "https://github.com/Genymobile/scrcpy/releases/download/$tag/SHA256SUMS.txt"
          version="$(python3 .github/scripts/bump-scrcpy.py "$RUNNER_TEMP/SHA256SUMS.txt" < "$RUNNER_TEMP/release.json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and build
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/scrcpy-$VERSION"
          title="fix(macos): bundle scrcpy $VERSION"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          sha="$(git rev-parse HEAD)"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "scrcpy $VERSION, checked against the release's SHA256SUMS.txt. Opened and merged by the scrcpy workflow once the builds pass."
            number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi
          gh workflow run build.yml --ref "$branch"
          # The dispatched run needs a moment to register its check runs on the commit.
          for _ in $(seq 30); do
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '.total_count')" -gt 0 ]] && break
            sleep 10
          done
          gh pr checks "$number" --watch --fail-fast --interval 30
          gh pr merge "$number" --squash --delete-branch --match-head-commit "$sha"
          gh workflow run build.yml --ref main
