# Weekly: looks for a new scrcpy release (which also brings its adb) and opens an issue for it.
# scripts/bump-scrcpy.sh makes the change. The workflow cannot commit it: main only takes commits
# whose checks ran on a push, a push made with GITHUB_TOKEN starts no workflow, and Actions may not
# open pull requests in this repository.
name: scrcpy

on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for a new release
        id: bump
        run: |
          gh api repos/Genymobile/scrcpy/releases/latest > "$RUNNER_TEMP/release.json"
          tag="$(jq -r .tag_name "$RUNNER_TEMP/release.json")"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::unexpected tag '$tag'"; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS.txt" \
            "https://github.com/Genymobile/scrcpy/releases/download/$tag/SHA256SUMS.txt"
          version="$(python3 .github/scripts/bump-scrcpy.py "$RUNNER_TEMP/SHA256SUMS.txt" < "$RUNNER_TEMP/release.json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open an issue
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          title="Bundle scrcpy $VERSION"
          if [[ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')" ]]; then
            exit 0
          fi
          gh issue create --title "$title" --body "scrcpy $VERSION is out: https://github.com/Genymobile/scrcpy/releases/tag/v$VERSION

          Run \`scripts/bump-scrcpy.sh\`, check the bundle with \`macos/scripts/fetch-scrcpy.sh\`, and commit the change as \`fix(macos): bundle scrcpy $VERSION\`."
