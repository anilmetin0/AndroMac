name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Report it privately through [Security Advisories](https://github.com/anilmetin0/AndroMac/security/advisories/new), as described in [SECURITY.md](https://github.com/anilmetin0/AndroMac/blob/main/SECURITY.md).

        [CONTRIBUTING.md](https://github.com/anilmetin0/AndroMac/blob/main/CONTRIBUTING.md#reporting-a-bug) lists what a useful report contains.

  - type: input
    id: android-version
    attributes:
      label: AndroMac version on the phone
      description: Settings → About on the phone. Copy the whole string, build and commit included.
      placeholder: 1.1.0 (42 · e105e58)
    validations:
      required: true

  - type: input
    id: mac-version
    attributes:
      label: AndroMac version on the Mac
      description: Settings → Devices on the Mac. Copy the whole string, build and commit included.
      placeholder: 1.1.0 (42 · e105e58)
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Which side shows the problem
      options:
        - Android
        - macOS
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 9, Android 15
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, MacBook Air M2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair both devices.
        2. Copy text on the Mac.
        3. The phone does not receive it.
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `adb logcat -s AndroMac` on the phone, `log stream --predicate 'senderImagePath CONTAINS "AndroMac"'` on the Mac. The logs carry no message content.
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Connection diagnostics
      description: |
        For a connection problem, paste the phone's **I can't connect** screen or the Mac's Settings → Network page. Redact anything you do not want public.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: Both devices are on the same Wi-Fi network, with AP isolation off.
          required: true
        - label: I searched the existing issues.
          required: true
